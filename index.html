<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Untuk Arissha ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
#popup {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.9);

    justify-content: center;

    align-items: center;

    z-index: 1000;
}

#fotoBesar {
    max-width: 90%;
    max-height: 85%;

    border-radius: 20px;

    box-shadow: 0 0 40px rgba(255,255,255,0.2);
}
        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Georgia, serif;

            background:
                radial-gradient(
                    circle at top,
                    #4b1c46,
                    #180d24 45%,
                    #050509 100%
                );

            color: white;
        }

        .glow {
            position: fixed;

            width: 250px;
            height: 250px;

            background: rgba(255, 70, 170, 0.15);

            border-radius: 50%;

            filter: blur(80px);

            animation: cahaya 5s infinite alternate;
        }

        @keyframes cahaya {

            from {
                transform: scale(1);
                opacity: 0.4;
            }

            to {
                transform: scale(1.5);
                opacity: 0.8;
            }

        }

        .container {
            width: 90%;
            max-width: 500px;

            text-align: center;

            padding: 40px 25px;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.15);

            border-radius: 25px;

            backdrop-filter: blur(10px);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.5);
        }

        .small-text {
            font-family: Arial, sans-serif;

            font-size: 12px;

            letter-spacing: 4px;

            text-transform: uppercase;

            opacity: 0.7;
        }

        h1 {
            margin-top: 20px;

            font-size: clamp(45px,14vw,75px);

            font-weight: normal;

            text-shadow:
                0 0 10px rgba(255,255,255,0.3),
                0 0 30px rgba(255,100,180,0.3);
        }

        .subtitle {
            margin-top: 15px;

            font-size: 17px;

            line-height: 1.8;

            opacity: 0.85;
        }

        button {
            margin-top: 30px;

            padding: 13px 25px;

            border-radius: 50px;

            border: 1px solid rgba(255,255,255,0.4);

            background: rgba(255,255,255,0.1);

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }.gallery {
    display: flex;
    gap: 12px;
    margin-top: 30px;
    justify-content: center;
}

.gallery img {
    width: 30%;
    height: 140px;
    object-fit: cover;
    border-radius: 18px;

    box-shadow: 0 8px 25px rgba(0,0,0,0.4);

    transition: 0.3s;
}

.gallery img:active {
    transform: scale(1.08);
}

        .heart {
            position: fixed;

            bottom: -30px;

            pointer-events: none;

            animation: naik 6s linear forwards;

            opacity: 0.8;

            z-index: -1;
        }

        @keyframes naik {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(25deg);

                opacity: 0;
            }

        }

    </style>

</head>


<body>

    <div class="glow"></div>


    <div class="container">

        <div class="small-text">
            a little website made for
        </div>

        <h1>
            Arissha ❤️
        </h1>

        <p class="subtitle">
            Karena beberapa perasaan
            terlalu indah untuk hanya disimpan.
        </p>

        <button onclick="pesan()">
            Buka pesannya 💌
        </button>

    <div class="gallery">

    <img src="foto/foto1.jpeg" onclick="lihatFoto(this)">

    <img src="foto/foto2.jpeg" onclick="lihatFoto(this)">

    <img src="foto/foto3.jpeg" onclick="lihatFoto(this)">

</div>

<div id="popup" onclick="tutupFoto()">
    <img id="fotoBesar" onclick="event.stopPropagation()">
</div>


    <script>

        function buatHati() {

            const heart =
                document.createElement("div");

            heart.className = "heart";

            heart.innerHTML = "❤️";

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.fontSize =
                (12 + Math.random() * 20) + "px";

            heart.style.animationDuration =
                (4 + Math.random() * 5) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {

                heart.remove();

            }, 9000);

        }


        setInterval(buatHati, 500);
function lihatFoto(foto) {

    document.getElementById("fotoBesar").src = foto.src;

    document.getElementById("popup").style.display = "flex";
}


function tutupFoto() {

    document.getElementById("popup").style.display = "none";
}

       function pesan() {
    document.body.innerHTML = `
        <div class="container">
            <div class="small-text">untuk seseorang yang spesial</div>

            <h1>Hai, Arissha ❤️</h1>

            <p class="subtitle">
                Kalau kamu sampai di halaman ini,
                berarti kamu sedang membaca sesuatu
                yang memang aku buat khusus untukmu.
                <br><br>
                Aku mungkin nggak selalu pandai
                mengungkapkan perasaan lewat kata-kata.
                Tapi setidaknya, lewat halaman kecil ini,
                aku ingin kamu tahu...
                <br><br>
                <b>kamu adalah seseorang yang sangat sempurna.</b> ❤️
            </p>

            <button onclick="location.reload()">
                Kembali ❤️
            </button>
        </div>
    `;
}

    </script>


</body>

</html>
